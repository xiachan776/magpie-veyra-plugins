<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CodeBuddy">
  <!--
    CodeBuddy（CN，provider id `codebuddy`）的 auth.icon。

    记号：一个方框里掏出一个缺口，右侧两点 —— 读作「代码块 + 由它带出的
    两个代理」。和 Veyra 的 V 完全不同形，因为这里是渠道不是插件。

    底色用腾讯 CodeBuddy 的青蓝；国际版（codebuddy-intl）用同一记号换深靛底，
    靠颜色区分两个同族渠道 —— 比在同一尺寸里画出第二套图形更可靠。
  -->
  <rect width="64" height="64" rx="15" fill="#1E8FE4"/>
  <path d="M15 24 L15 19 L20 19" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M20 40 L15 40 L15 45" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M44 19 L49 19 L49 24" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M49 40 L49 45 L44 45" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="32" cy="27" r="3.4" fill="#fff"/>
  <path d="M32 33 L32 42" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Loomy">
  <!--
    Loomy（讯飞，provider id `loomy`）的 auth.icon。

    记号：三层同心弧 + 一个实心点 —— 读作「会话持续往外扩」，也是讯飞系的
    蓝绿调。刻意画成弧而不是圆环，和 CodeBuddy 的方框、CodeArts 的尖括号
    在缩小到 16 px 时仍然一眼分得开。
  -->
  <rect width="64" height="64" rx="15" fill="#0FA3A3"/>
  <path d="M18 40 C18 30 24 24 32 24 C40 24 46 30 46 40" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M24 44 C24 38 27 34 32 34 C37 34 40 38 40 44" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" opacity="0.75"/>
  <circle cx="32" cy="20" r="3.6" fill="#fff"/>
</svg>

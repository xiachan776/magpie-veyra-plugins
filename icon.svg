<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Veyra">
  <!--
    provider 卡片图标。

    `package.json` 的 `magpie.icon` 必须是 `https://` 或 `data:image/` 开头
    （`internal/plugin/host.js` 的 `iconOf()` 校验），且 ≤ 1.5 MB，所以本文件的
    base64 被内联进了 `magpie.icon`。改这里就要同步改 package.json：
    见 `scripts/icon.mjs`（`npm run icon` 会把两边对齐）。

    与 `page/icon.svg` 的分工：页面图标走 `magpie.page.icon`（相对路径、文件形式），
    provider 卡片图标走 `magpie.icon`（data URI）—— 宿主是两条互不相通的读取链。
    `magpie.page.icon` 不会成为 provider 图标，反之亦然。

    设计：深色底圆角方块 + 白色 V + 五个点（本包服务的五家订阅）。
    用固定配色而非 currentColor —— 它被渲染在 `<img>` 里，没有继承的文本颜色。
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7b3ff2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <path d="M17 19l15 27 15-27" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" opacity="0.92">
    <circle cx="20" cy="52" r="2.6"/>
    <circle cx="26" cy="52" r="2.6"/>
    <circle cx="32" cy="52" r="2.6"/>
    <circle cx="38" cy="52" r="2.6"/>
    <circle cx="44" cy="52" r="2.6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Veyra">
  <!--
    Veyra 插件图标（`magpie.icon`），用在「发现」卡片和「已安装」那一行；
    没有 `auth.icon` 的供应商也复用它。

    ## 只有这一套图形

    这个方块是 Veyra 的品牌标识，和 DSH 侧边栏那个蓝 V 是同一个造型：
    渐变蓝底 + 白色 V 主体 + 贯穿波浪，**不是**某个渠道的记号。
    历史上这里画的是「紫方块 + 五颗点」，`page/icon.svg` 又画了「三根竖条」，
    一个插件里出现两套互不相干的图形，用户没法把这些行认成同一家。
    统一原则：插件自己一个标识（本文件），渠道各自一个（各 auth.icon）。

    ## 配色固定，不用 currentColor

    `magpie.icon` 被渲染进 `<img>`，没有可继承的文本颜色；而且它同时出现在
    「发现」（从 npm / GitHub 读）和「已安装」两处，必须与页面主题无关。

    ## 品牌色

    `#55ACFF → #3E8FF7 → #2A6FE0` 三段蓝，和 Veyra 的 DSH 侧边栏图标同值。
    改本文件后必须跑 `npm run icon` 把 base64 同步进 package.json，
    否则 `npm test`（`node scripts/icon.mjs --check`）会红。
  -->
  <defs>
    <linearGradient id="veyraBrand" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#55ACFF"/>
      <stop offset="0.5" stop-color="#3E8FF7"/>
      <stop offset="1" stop-color="#2A6FE0"/>
    </linearGradient>
  </defs>

  <!-- 底：圆角方块，沿用 magpie 卡片图标的圆角比例 -->
  <rect width="64" height="64" rx="15" fill="url(#veyraBrand)"/>

  <!-- V 主体：两笔斜下在下方汇合 -->
  <path d="M17 18 L32 46 L47 18"
        fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 贯穿波浪：从左臂中段穿到右臂中段，压在 V 之上，是 Veyra 标识的识别点 -->
  <path d="M14 33 C21 27 27 39 34 33 C40 28 46 32 50 30"
        fill="none" stroke="#fff" stroke-width="3.4"
        stroke-linecap="round" stroke-opacity="0.95"/>
</svg>

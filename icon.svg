    Veyra 插件图标：品牌蓝 V + 贯穿波浪。

    图形不是手画的，是从 1024 参考图上把每一块蓝色区域描出来的（阈值 232）：
      * 上排波浪带 + 左臂 + 右臂 + 右尾 —— 一个连通块
      * V 身体（尖 478,736）—— 一块，内部反白小三角由 evenodd 自动挖空
      * 波浪带下缘的左侧月牙

    轮廓取边界后做了弧长重采样 + 周期高斯平滑（sigma≈1.7 源像素）再简化，
    所以边缘是顺的，不会带 1px 锯齿；拐角（顶杠两端、V 尖）依然保持锐利。
    缩放：K = 60/669，TX = -226K+2，TY = -287K+1.5。
    透明底，没有方块也没有白描边 —— 参考图本身就是蓝字压在空底上。
  -->
